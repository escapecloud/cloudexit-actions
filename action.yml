name: "GitHub Action for cloudexit"
description: "Run cloudexit assessments in GitHub Actions"
author: "EscapeCloud"

inputs:
  version:
    description: "cloudexit version tag (e.g: v2.0.0)"
    required: false
    default: "v2.0.0"
  provider:
    description: "Cloud Provider: aws or azure"
    required: true
  auth-mode:
    description: "Authentication mode: static or oidc"
    required: false
    default: "static"
  exit-strategy:
    description: "Exit Strategy: 1 (Repatriation), 2 (Hybrid Cloud) or 3 (Alternate Cloud)"
    required: true
  assessment-type:
    description: "Assessment Type: 1 (Basic) or 2 (Standard)"
    required: true
  egress:
    description: "Estimate egress data volume and add an egress report: true or false"
    required: false
    default: "false"
  tfstate:
    description: "Path to a Terraform/OpenTofu state file, relative to the workspace."
    required: false
    default: ""
  host:
    description: "Optional EscapeCloud Platform host (CLOUDEXIT_HOST). Empty means offline mode."
    required: false
    default: ""
  key:
    description: "Optional EscapeCloud Platform API key (CLOUDEXIT_API_KEY). Empty means offline mode."
    required: false
    default: ""
  upload:
    description: "Upload to the platform: auto (when host and key are set), required (fail without them) or off"
    required: false
    default: "auto"
  strict:
    description: "Fail the run when the platform reports warnings: true or false"
    required: false
    default: "false"

outputs:
  report-dir:
    description: "Path to generated reports directory"

runs:
  using: "docker"
  image: "Dockerfile"

branding:
  icon: "download-cloud"
  color: "gray-dark"
